<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 p-6">

  <!-- Title Row -->
  <header class="mb-6">
    <h1 class="text-4xl font-bold text-center">My Dashboard</h1>
  </header>

  <!-- Prominent Text Row -->
  <section class="mb-8">
    <p class="text-2xl font-semibold text-center text-indigo-700">
      Welcome to your personalized dashboard overview
    </p>
  </section>

  <!-- Two-Column Layout -->
  <section class="flex flex-col lg:flex-row gap-6">
    
    <!-- List Column -->
    <div class="basis-[60ch] flex-shrink-0 lg:w-1/3 bg-white shadow p-4 rounded">
      <h2 class="text-xl font-semibold mb-4">Quick Links</h2>
      <ul class="list-disc list-inside space-y-2">
        <li>View Reports</li>
        <li>Manage Settings</li>
        <li>Team Overview</li>
      </ul>
    </div>

    <!-- Calendar Column -->
    <div class="flex-grow bg-white shadow p-4 rounded">
      <h2 class="text-xl font-semibold mb-4">Calendar</h2>
      <iframe 
        src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=America%2FNew_York" 
        class="w-full h-96 rounded" 
        frameborder="0" 
        scrolling="no">
      </iframe>
    </div>

  </section>

</body>
</html>
